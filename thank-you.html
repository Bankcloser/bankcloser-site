<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request Sent | Bank Closers</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1f3a;--navy2:#132d52;--gold:#c9a24a;--ink:#1c2533;--muted:#5d6878;--bg:#f6f7f9;--line:#e3e7ec}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);line-height:1.6;background:#fff;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;width:100%}
header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--navy)}
.logo span{color:var(--gold)}
.btn{display:inline-block;padding:13px 24px;border-radius:8px;font-weight:600;font-size:15px;transition:.2s}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:#b48d38}
.btn-ghost{border:1.5px solid rgba(255,255,255,.5);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.1)}
main{flex:1;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;display:flex;align-items:center;padding:96px 0;position:relative;overflow:hidden}
main:after{content:"";position:absolute;right:-180px;top:-180px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,74,.25),transparent 70%)}
.box{position:relative;z-index:1;text-align:center;max-width:640px;margin:0 auto}
.check{width:72px;height:72px;border-radius:50%;background:var(--gold);color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;margin:0 auto 26px}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:13px;font-weight:600;color:var(--gold)}
h1{font-size:42px;line-height:1.15;letter-spacing:-1px;font-weight:800;margin:14px 0 16px}
p{font-size:18px;color:#c8d3e3;margin-bottom:34px}
p a{color:#fff;font-weight:600;border-bottom:1px solid var(--gold)}
.ctas{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
footer{background:#071629;color:#7f8ea3;font-size:14px;padding:28px 0}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media(max-width:560px){h1{font-size:32px}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <a class="logo" href="/">Bank<span>Closers</span></a>
  <a class="btn btn-gold" href="/">Back to Home</a>
</div></header>
<main><div class="wrap"><div class="box">
  <div class="check">✓</div>
  <div class="eyebrow">Request received</div>
  <h1>Thanks, your closing request was sent.</h1>
  <p>We'll confirm shortly. Questions in the meantime? Email us at <a href="mailto:Info@bankcloser.com">Info@bankcloser.com</a>.</p>
  <div class="ctas"><a class="btn btn-gold" href="/">Back to Home</a><a class="btn btn-ghost" href="mailto:Info@bankcloser.com">Info@bankcloser.com</a></div>
</div></div></main>
<footer><div class="wrap"><span>© 2026 Bank Closers. All rights reserved.</span><span>New York, NY</span></div></footer>
</body></html>
